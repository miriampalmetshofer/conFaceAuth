[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conFaceAuth"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
face-auth = "face_auth.apps.main:main"
face-auth-live = "face_auth.apps.live:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"face_auth.configs" = ["*.json"]
